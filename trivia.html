const catMap = Object.fromEntries(CATEGORIES.filter(c=>c.key!=="all").map(c=>[c.key,c]));

const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("cardGrid");
const countEl = document.getElementById("resultCount");
const searchEl = document.getElementById("searchInput");

let activeCat = "all";
let query = "";

function renderTabs(){
  tabsEl.innerHTML = CATEGORIES.map(c => `
    <button class="tab ${c.key===activeCat?"active":""}" data-cat="${c.key}">
      ${c.emoji ? c.emoji+" " : ""}${c.label}
    </button>
  `).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeCat = btn.dataset.cat;
      renderTabs();
      renderCards();
    });
  });
}

function matches(item){
  const inCat = activeCat === "all" || item.cat === activeCat;
  if(!inCat) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  return (item.title + item.explain).toLowerCase().includes(q);
}

function renderCards(){
  const items = ITEMS.filter(matches);
  countEl.textContent = `${items.length}개의 상식`;

  if(items.length === 0){
    gridEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">조건에 맞는 상식이 없어요. 다른 키워드나 분야를 선택해보세요.</div>`;
    return;
  }

  gridEl.innerHTML = items.map(item => {
    const c = catMap[item.cat];
    const videoUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(item.query);
    return `
    <article class="card" style="--field-color:${c.color}">
      <span class="badge">${c.emoji} ${c.label}</span>
      <h2>${item.title}</h2>
      <p class="explain">${item.explain}</p>
      <div class="card-bottom">
        <a class="link-btn" href="${item.wiki}" target="_blank" rel="noopener noreferrer">📖 더 읽어보기</a>
        <a class="link-btn" href="${videoUrl}" target="_blank" rel="noopener noreferrer">▶ 영상 찾아보기</a>
      </div>
    </article>
    `;
  }).join("");
}

searchEl.addEventListener("input", (e)=>{
  query = e.target.value.trim();
  renderCards();
});

renderTabs();
renderCards();
</script>
